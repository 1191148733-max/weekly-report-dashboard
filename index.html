  <style>

  <style>

    function topModelMonthlyCalc(store){const source=topModels[store]||{months:[],records:[]},year=state.month.slice(0,4),months=(source.months||[]).filter(m=>m.startsWith(year+'-')&&m<=state.month),records=(source.records||[]).filter(r=>months.includes(r.month)),totalAmount=records.reduce((s,r)=>s+(val(r.amount)||0),0),totalQty=records.reduce((s,r)=>s+(val(r.qty)||0),0),monthCards=months.map(month=>{const monthRecords=records.filter(r=>r.month===month),monthTotal=monthRecords.reduce((s,r)=>s+(val(r.amount)||0),0),ytdRecords=records.filter(r=>r.month.startsWith(year+'-')&&r.month<=month),ytdTotal=ytdRecords.reduce((s,r)=>s+(val(r.amount)||0),0),ytdMap=new Map();ytdRecords.forEach(r=>{const key=`${r.code}|${r.model}`;if(!ytdMap.has(key))ytdMap.set(key,{qty:0,amount:0});const row=ytdMap.get(key);row.qty+=(val(r.qty)||0);row.amount+=(val(r.amount)||0)});const rows=monthRecords.slice().sort((a,b)=>(val(b.amount)||0)-(val(a.amount)||0)).slice(0,8).map((r,i)=>{const ytd=ytdMap.get(`${r.code}|${r.model}`)||{qty:0,amount:0};return {...r,rank:i+1,monthTotal,ytdQty:ytd.qty,ytdAmount:ytd.amount,ytdShare:ratio(ytd.amount,ytdTotal)}});return {month,monthTotal,rows}});return {months,monthCards,totalAmount,totalQty}}
    function topMonthCard(card){const body=card.rows.map(r=>{const rowClass=r.highlightType?`highlight-${r.highlightType}`:'',badge=r.badge?`<span class="badge ${r.highlightType}">${r.badge}</span>`:'';return `<tr class="${rowClass}"><td class="rank">${r.rank}</td><td><div class="model-line"><span class="model-name">${r.model}</span>${badge}</div><span class="product-code">${r.code}</span></td><td>${fmt(r.qty,0)}</td><td>${fmt0(r.amount)}万</td><td>${pct0(ratio(r.amount,r.monthTotal))}</td><td class="annual">${fmt(r.ytdQty,0)}</td><td class="annual">${fmt0(r.ytdAmount)}万</td><td class="annual">${pct0(r.ytdShare)}</td></tr>`}).join('');return `<div class="top-month-card"><div class="top-month-head"><h3>${Number(card.month.slice(5))}月</h3><div class="top-month-total">当月销售 ${fmt0(card.monthTotal)}万</div></div><table class="top-month-table"><thead><tr><th>排</th><th>型号</th><th>数量</th><th>销售</th><th>占比</th><th class="annual">累计量</th><th class="annual">累计销售</th><th class="annual">累计占比</th></tr></thead><tbody>${body}</tbody></table></div>`}
    function topModelOutbound(){const calc=topModelMonthlyCalc(state.store);if(!calc.months.length)return `<div class="panel"><div class="empty">暂无TOP8型号出库数据</div></div>`;const note=state.store==='热水器自营'?'统计口径：供价上账；出库台量=全国昨日出库商品件数，销售金额=出库金额。':'年累计2C销售金额与上方销售概览里的年累计2C出库金额保持同一口径。';return `<div class="panel"><div class="top-model-summary"><div class="top-model-kpi"><span>年累计2C销售金额</span><b>${fmt0(calc.totalAmount)}万</b></div><div class="top-model-kpi"><span>年累计2C出库台量</span><b>${fmt(calc.totalQty,0)}</b></div><div class="top-model-note">统计周期：2026年1月-${Number(state.month.slice(5))}月；每月展示当月销售金额占比TOP8；${note}</div></div><div class="top-month-grid">${calc.monthCards.map(topMonthCard).join('')}</div></div>`}

    function starLineGroup(line){const text=String(line||'');if(text.includes('油烟机')||text.includes('烟机'))return 'hood';if(text.includes('灶具'))return 'stove';return 'other'}
    function starMonthlyLineChart(){const active=starActiveMonth(),months=(starSelection.months||[]).filter(m=>m<=active&&m.startsWith(active.slice(0,4))),lines=starRecords('by_line'),monthlyRows=starRecords('monthly');if(!months.length)return `<div class="panel"><div class="empty">分月销售暂无数据</div></div>`;const monthlyMap=Object.fromEntries(monthlyRows.map(r=>[r.month,r])),lineMap=new Map();lines.forEach(r=>{if(!months.includes(r.month))return;const key=`${r.month}|${starLineGroup(r.line)}`;lineMap.set(key,(lineMap.get(key)||0)+(val(r.amount_wan)||0))});const points=months.map(m=>({month:m,total:val(monthlyMap[m]?.amount_wan)||0,yoy:monthlyMap[m]?.amount_yoy,hood:lineMap.get(`${m}|hood`)||0,stove:lineMap.get(`${m}|stove`)||0,other:lineMap.get(`${m}|other`)||0}));const max=Math.max(...points.map(p=>p.total),1)*1.12;const parts=[{name:'油烟机',key:'hood',cls:'cat-smoke',color:'#8f1111'},{name:'灶具',key:'stove',cls:'cat-stove',color:'#d97706'},{name:'其他',key:'other',cls:'cat-other',color:'#8b8f96'}];const columns=points.map((p,i)=>{const actualH=Math.max(0,p.total)/max*100,values=parts.map(part=>Math.max(0,p[part.key]||0)),mix=Math.max(values.reduce((a,b)=>a+b,0),.0001),totalBottom=Math.min(88,Math.max(actualH,1)+1),mom=i>0?compare(p.total,points[i-1].total):null;return `<div class="category-month-col"><div class="category-bar-zone"><div class="trend-bubble">同比 ${trend(p.yoy)} · 环比 ${trend(mom)}</div><div class="category-actual-bar" style="height:${Math.max(actualH,1)}%">${parts.map((part,idx)=>`<div class="${part.cls}" style="height:${values[idx]/mix*100}%"></div>`).join('')}</div><div class="category-total" style="bottom:${totalBottom}%">${fmt0(p.total)}</div></div><div class="category-month-info"><div class="category-month">${Number(p.month.slice(5))}月</div>${parts.map((part,idx)=>`<div><b style="color:${part.color}">${part.name}</b> ${fmt0(values[idx])} / ${pct(ratio(values[idx],mix),0)}</div>`).join('')}</div></div>`}).join('');return `<div class="panel star-monthly-cha     function starDimensionRows(records,keyFn){const active=starActiveMonth(),monthRows=records.filter(r=>r.month===active),ytdRows=starRowsUntil(records),monthTotal=sumRows(monthRows,'amount_wan'),ytdTotal=sumRows(ytdRows,'amount_wan'),map=new Map();function ensure(key,row){if(!map.has(key))map.set(key,{key,row,monthQty:0,monthAmount:0,ytdQty:0,ytdAmount:0});return map.get(key)}monthRows.forEach(r=>{const item=ensure(keyFn(r),r);item.monthQty+=val(r.qty)||0;item.monthAmount+=val(r.amount_wan)||0});ytdRows.forEach(r=>{const item=ensure(keyFn(r),r);item.ytdQty+=val(r.qty)||0;item.ytdAmount+=val(r.amount_wan)||0});return Array.from(map.values()).map(r=>({...r,monthShare:ratio(r.monthAmount,monthTotal),ytdShare:ratio(r.ytdAmount,ytdTotal)})).sort((a,b)=>(b.ytdAmount||0)-(a.ytdAmount||0))}

    function starProvinceTable(){const records=starRecords('by_province'),active=starActiveMonth(),months=(starSelection.months||[]).filter(m=>m<=active&&m.startsWith(active.slice(0,4))),ytdRows=starRowsUntil(records),monthTotals=Object.fromEntries(months.map(m=>[m,sumRows(records.filter(r=>r.month===m),'amount_wan')])),ytdTotal=sumRows(ytdRows,'amount_wan'),provinces=Array.from(new Set(ytdRows.map(r=>r.province))).map(province=>{const ytd=sumRows(ytdRows.filter(r=>r.province===province),'amount_wan');return {province,ytd}}).sort((a,b)=>b.ytd-a.ytd);if(!provinces.length)return `<div class="panel"><div class="empty">区域销售情况暂无数据</div></div>`;const head=months.map(m=>`<th>${Number(m.slice(5))}月</th>`).join(''),body=provinces.map(p=>`<tr><td>${p.province}</td>${months.map(m=>`<td>${pct0(ratio(sumRows(records.filter(r=>r.month===m&&r.province===p.province),'amount_wan'),monthTotals[m]))}</td>`).join('')}<td class="share-cell">${pct0(ratio(p.ytd,ytdTotal))}</td></tr>`).join('');return `<div class="panel"><h3>区域销售情况</h3><div class="wide-table-wrap"><table class="star-region-table"><thead><tr><th>省份</th>${head}<th>年累计</th></tr></thead><tbody>${body}</tbody></table></div></div>`}
    function renderStarSelectionDetail(){detailView.innerHTML=`${storeTabButtons()}<section>${sectionHead('五星星选 · 销售概览','金额口径：销售数量 × 销售金额，单位：万元')}${starSummaryCards()}${starMonthlyLineChart()}<div class="grid grid-2">${starDimensionTable('分品线销售',starRecords('by_line'),r=>r.line,30)}${starDimensionTable('分型号销售',starRecords('by_model'),r=>`${r.model}<span class="product-code">${r.line}</span>`,40)}</div><div style="margin-top:12px">${starProvinceTable()}</div></section>`;bindStoreTabs()}

    function miniKpi(t,a,target){return `<div class="metric-title">${t}</div><div class="metric-value">${fmt(a)} 万</div><div class="metric-foot"><span>目标 ${fmtInt(target)} 万</span><span>${pct(ratio(a,target))}</span></div>${progress(a,target)}`}
    function funnel(metrics){const max=Math.max(...metrics.map(m=>m[1]||0),1);return `<div class="funnel">${metrics.map(([l,v])=>`<div class="funnel-step"><div>${l}</div><div class="funnel-bar"><span style="width:${Math.max(2,(v||0)/max*100)}%"></span></div><div>${fmtInt(v)}</div></div>`).join('')}</div>`}
    function lineChart(rows,series,title,percent=false){const valid=series.map(([name,key],i)=>({name,key,color:colors[i%colors.length],points:rows.map((r,idx)=>({idx,month:r.month.slice(5),value:val(r[key])})).filter(p=>finite(p.value))}));const all=valid.flatMap(s=>s.points.map(p=>percent?p.value*100:p.value));if(!all.length)return `<div class="empty">${title}暂无数据</div>`;const min=Math.min(0,...all),max=Math.max(...all,1),w=760,h=250,padL=48,padR=18,padT=22,padB=34;const x=idx=>padL+(rows.length<=1?0:idx/(rows.length-1))*(w-padL-padR);const y=v=>padT+(max-v)/(max-min||1)*(h-padT-padB);const paths=valid.map(s=>{const d=s.points.map((p,j)=>`${j?'L':'M'} ${x(p.idx)} ${y(percent?p.value*100:p.value)}`).join(' ');const dots=s.points.map(p=>`<circle cx="${x(p.idx)}" cy="${y(percent?p.value*100:p.value)}" r="3" fill="${s.color}"><title>${s.name} ${p.month}: ${percent?pct(p.value):fmt(p.value)}</title></circle>`).join('');return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.4" />${dots}`}).join('');const xLabels=rows.map((r,idx)=>idx%2===0?`<text x="${x(idx)}" y="${h-10}" text-anchor="middle">${r.month.slice(5)}</text>`:'').join('');const yLabels=[0,.5,1].map(t=>{const v=min+(max-min)*t;return `<text x="8" y="${y(v)+4}">${percent?v.toFixed(0)+'%':v.toFixed(0)}</text><line x1="${padL}" x2="${w-padR}" y1="${y(v)}" y2="${y(v)}" stroke="#ededf0" />`}).join('');return `<div class="metric-title">${title}</div><svg class="chart" viewBox="0 0 ${w} ${h}">${yLabels}${paths}${xLabels}</svg><div class="legend">${valid.map(s=>`<span style="--legend-color:${s.color}">${s.name}</span>`).join('')}</div>`}
